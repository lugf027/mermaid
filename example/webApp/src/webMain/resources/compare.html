<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid KMP vs JS — Rendering Comparison</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header / Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: #1a1a2e;
            color: #fff;
            flex-shrink: 0;
        }
        .toolbar h1 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }
        .toolbar select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #16213e;
            color: #fff;
            font-size: 13px;
            max-width: 260px;
        }
        .toolbar .spacer { flex: 1; }
        .toolbar button {
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #0f3460;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        .toolbar button:hover { background: #1a5276; }
        .toolbar button.active { background: #e94560; border-color: #e94560; }

        /* ── Main Area ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Editor Mode: 3-column layout ── */
        .editor-mode {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .render-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1px solid #ddd;
            background: #fff;
            margin: 4px;
            border-radius: 6px;
            overflow: hidden;
        }
        .render-panel .panel-header {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .render-panel.kmp .panel-header { background: #e8f5e9; color: #2e7d32; }
        .render-panel.js .panel-header { background: #e3f2fd; color: #1565c0; }
        .render-panel .panel-body {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .render-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .render-panel .mermaid-js-output {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #fff;
        }
        .render-panel .mermaid-js-output svg {
            max-width: 100%;
            max-height: 100%;
        }

        .editor-column {
            width: 320px;
            min-width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            margin: 4px 0;
        }
        .editor-column textarea {
            flex: 1;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.5;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: none;
            outline: none;
            background: #fafafa;
        }
        .editor-column textarea:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.15);
        }

        /* ── Gallery Mode ── */
        .gallery-mode {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }
        .gallery-mode.active { display: block; }
        .editor-mode.hidden { display: none; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(700px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .gallery-item-header {
            padding: 8px 12px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 14px;
        }
        .gallery-item-body {
            display: flex;
            min-height: 300px;
        }
        .gallery-item-body .gallery-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .gallery-item-body .gallery-panel + .gallery-panel {
            border-left: 1px solid #eee;
        }
        .gallery-panel-label {
            position: absolute;
            top: 4px; left: 8px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .gallery-panel.kmp .gallery-panel-label { background: #e8f5e9; color: #2e7d32; }
        .gallery-panel.js .gallery-panel-label { background: #e3f2fd; color: #1565c0; }
        .gallery-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .gallery-panel .mermaid-js-gallery {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* ── Status bar ── */
        .status-bar {
            padding: 4px 16px;
            font-size: 11px;
            color: #888;
            background: #f0f0f0;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>Mermaid KMP vs JS</h1>
    <select id="sampleSelector">
        <option value="">— Select a sample —</option>
    </select>
    <div class="spacer"></div>
    <button id="btnEditor" class="active">Editor</button>
    <button id="btnGallery">Gallery</button>
</div>

<div class="main">
    <!-- Editor Mode -->
    <div class="editor-mode" id="editorMode">
        <div class="render-panel kmp" id="kmpPanel">
            <div class="panel-header">Mermaid-KMP (Canvas)</div>
            <div class="panel-body">
                <iframe id="kmpFrame" src="index.html?mode=render&text="></iframe>
            </div>
        </div>

        <div class="editor-column">
            <textarea id="codeEditor" spellcheck="false" placeholder="Enter Mermaid diagram code here..."></textarea>
        </div>

        <div class="render-panel js" id="jsPanel">
            <div class="panel-header">Mermaid-JS (SVG)</div>
            <div class="panel-body">
                <div class="mermaid-js-output" id="jsOutput"></div>
            </div>
        </div>
    </div>

    <!-- Gallery Mode -->
    <div class="gallery-mode" id="galleryMode">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</div>

<div class="status-bar" id="statusBar">Ready</div>

<script type="module" src="compare.js"></script>
</body>
</html>
